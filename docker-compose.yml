services:
  postgres:
    image: postgres:18.3-alpine
    container_name: mtbl-prefect-postgres
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fantasy-pg:
    image: postgres:18.3-alpine
    container_name: mtbl-fantasy-pg
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy_baseball
    volumes:
      - fantasy_pg_data:/var/lib/postgresql
    # Published on host 5433 so host-direct `uv run python -m mtbl_prefect ...`
    # flows can reach this container's Postgres without the runner network.
    # Inside the compose network the runner still reaches it as `fantasy-pg:5432`.
    # 5433 (not 5432) avoids colliding with a developer's host-native Postgres
    # which conventionally listens on 5432.
    #
    # Bound to 127.0.0.1 — NOT 0.0.0.0 — so the published port is reachable
    # only from this machine, never from LAN/VPN. The dev creds are weak
    # (`fantasy:fantasy`) and the database is unencrypted on the wire; the
    # loopback bind is the load-bearing protection. See README §Host-direct setup.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy_baseball"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: mtbl-prefect-server
    command: prefect server start --host 0.0.0.0 --port 4200
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_URL: http://localhost:4200
      PREFECT_API_URL: http://localhost:4200/api
      # Serve the new React UI v2 (TanStack/Vite rewrite). Ships inside the
      # 3-latest image behind this flag; default is still the legacy UI.
      PREFECT_SERVER_UI_V2_ENABLED: "true"
      # Mute the Prefect Cloud upsell banners in the self-hosted UI.
      PREFECT_SERVER_UI_SHOW_PROMOTIONAL_CONTENT: "false"
    ports:
      - "4200:4200"
    restart: unless-stopped

  runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtbl-prefect-runner
    depends_on:
      prefect-server:
        condition: service_started
      fantasy-pg:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      MTBL_VENV_ROOT: /opt/uv-envs
      # uv's package cache (overlayfs) and the per-project venv target (named
      # volume) are on different filesystems, so hardlinks can't be used.
      # Tell uv to copy instead — suppresses the noisy warning on every install.
      UV_LINK_MODE: copy
    env_file:
      - .env
    volumes:
      # Native-path mounts: same path inside the container as on the host so
      # sub-project CLIs with hardcoded /Users/Shared/BaseballHQ/... defaults
      # resolve correctly without per-CLI overrides.
      # Tools mount is read-write because setuptools-based sub-projects (e.g.
      # player-universe-load) need to write <pkg>.egg-info during build.
      # Hatchling-based sub-projects don't, but a single mount mode applies to
      # all. Build artifacts land in __pycache__/ and *.egg-info/ which are
      # gitignored on the host.
      - /Users/Shared/BaseballHQ/tools:/Users/Shared/BaseballHQ/tools
      - /Users/Shared/BaseballHQ/resources:/Users/Shared/BaseballHQ/resources
      - uv_env_cache:/opt/uv-envs

volumes:
  prefect_db:
  uv_env_cache:
  fantasy_pg_data:
